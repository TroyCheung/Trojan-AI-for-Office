<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Trojan AI for Office 使用帮助</title><style>body{max-width:680px;margin:60px auto;padding:24px;font:18px/1.7 system-ui;color:#24302b}h1{font-size:28px}</style><h1>Trojan AI for Office 使用帮助</h1><p>首次使用请在插件设置中选择模型服务，填写自己的 API Key，并选择模型。服务地址应与 Key 所属服务和套餐对应。</p><p>请先用文件副本尝试一个简单任务，再决定是否采用修改。可在设置中加入自己的指令，或导入自己的技能文件。</p><p>插件打不开时，重新打开 Trojan AI for Office 应用，再保存文件并完全退出、重新打开 Office。公司电脑可能限制自定义插件，请遵循公司的管理要求。</p><p>需要帮助时，请联系向你提供安装包的人，并说明使用的应用、想完成的任务及出现的提示。截图请遮住 API Key 和客户资料。</p></html>
